<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点点推荐可信度优化 · 原型 v3</title>
<style>
  body {
    --canvas: #e9eaee;
    --bg: #f5f6f8;
    --card: #ffffff;
    --line: #ececec;
    --line-2: #f3f3f3;
    --text: #222222;
    --text-2: #666666;
    --text-3: #a3a3a3;
    --chip: #f3f3f5;
    --bubble: #e9e9ec;
    --icon: #333333;
    --red: #ff2442;
    --red-soft: #fff0f2;
    --red-line: #ffd6dc;
    --green: #1aa260;
    --green-bg: #e9f8f0;
    --yellow: #a87a00;
    --yellow-bg: #fff5d6;
    --low: #e03131;
    --low-bg: #fff0f0;
    --gray: #8a8a8a;
    --gray-bg: #f2f3f5;
    --stale: #c26a00;
    --stale-bg: #fff3e0;
    --tip-bg: #2b2b2b;
  }
  body.dark {
    --canvas: #2a2a2d;
    --bg: #0f0f10;
    --card: #1c1c1e;
    --line: #2e2e31;
    --line-2: #262628;
    --text: #f2f2f2;
    --text-2: #b4b4b8;
    --text-3: #6e6e73;
    --chip: #2a2a2d;
    --bubble: #2c2c2e;
    --icon: #dddddd;
    --red-soft: rgba(255, 36, 66, .14);
    --red-line: rgba(255, 36, 66, .35);
    --green: #34c77b;
    --green-bg: rgba(52, 199, 123, .14);
    --yellow: #e8b938;
    --yellow-bg: rgba(232, 185, 56, .14);
    --low: #ff6b6b;
    --low-bg: rgba(255, 107, 107, .14);
    --gray: #9a9a9f;
    --gray-bg: #2a2a2d;
    --stale: #ffa94d;
    --stale-bg: rgba(255, 169, 77, .14);
    --tip-bg: #3a3a3d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  button { font-family: inherit; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--canvas);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    transition: background .2s;
  }
  .canvas { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 30px 16px; }

  /* ---------- 手机框 ---------- */
  .phone {
    width: 375px; height: 812px; background: var(--bg); color: var(--text);
    border-radius: 44px; position: relative; overflow: hidden;
    box-shadow: 0 0 0 10px #111, 0 20px 60px rgba(0,0,0,.25);
    display: flex; flex-direction: column;
  }
  .statusbar { height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 26px 0 32px; font-size: 15px; font-weight: 600; }
  .statusbar .icons { display: flex; gap: 6px; align-items: center; font-size: 12px; }
  .battery { border-radius: 4px; padding: 0 4px; font-size: 10px; line-height: 14px; background: var(--text); color: var(--bg); }
  .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: #bdbdbd; z-index: 40; }

  .navbar { height: 48px; flex-shrink: 0; display: flex; align-items: center; padding: 0 16px; gap: 10px; }
  .navbar .back { font-size: 24px; width: 24px; color: var(--icon); cursor: pointer; line-height: 1; }
  .orb { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #c9fff4, #6fe3d0 60%, #47cdb9); }
  .navbar .title { font-size: 17px; font-weight: 600; flex: 1; user-select: none; }
  .navbar .title.center { text-align: center; }
  .navbar .more { font-size: 20px; letter-spacing: 1px; color: var(--icon); width: 24px; text-align: right; }

  .scroll { flex: 1; overflow-y: auto; padding: 0 14px 12px; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }

  /* ---------- 页面1 ---------- */
  .searchbar { display: flex; align-items: center; gap: 8px; height: 38px; background: var(--card); border-radius: 19px; padding: 0 14px; margin: 2px 0 14px; border: 1px solid var(--line); }
  .searchbar input { border: none; outline: none; flex: 1; font-size: 14px; background: transparent; color: var(--text); font-family: inherit; }
  .searchbar input::placeholder, .input-pill input::placeholder { color: var(--text-3); }
  .searchbar .go { font-size: 13px; color: var(--red); font-weight: 600; }

  .user-msg { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .user-msg div { background: var(--bubble); border-radius: 18px; padding: 10px 14px; font-size: 15px; max-width: 80%; }

  .ai-card { background: var(--card); border-radius: 18px; padding: 16px 14px 12px; }
  .ai-intro { font-size: 14.5px; line-height: 1.7; margin-bottom: 10px; }
  .ai-intro b { font-weight: 600; }

  .pref-bar { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); background: var(--chip); border-radius: 8px; padding: 7px 10px; margin-bottom: 10px; cursor: pointer; }
  .pref-bar span { flex: 1; }
  .pref-bar em { font-style: normal; color: var(--red); flex-shrink: 0; }

  .rec { position: relative; border: 1px solid var(--line); border-radius: 14px; padding: 26px 12px 12px; margin-bottom: 10px; background: var(--card); }
  .rec-top { display: flex; gap: 10px; }
  .rec-thumb { width: 54px; height: 54px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 25px; }
  .rec-body { flex: 1; min-width: 0; }
  .rec-name { font-size: 15px; font-weight: 600; line-height: 1.35; display: flex; justify-content: space-between; gap: 6px; }
  .rec-name em { font-style: normal; font-size: 13px; color: var(--red); flex-shrink: 0; }
  .rec-desc { font-size: 12.5px; color: var(--text-2); margin-top: 4px; line-height: 1.5; }
  .rec-cat { font-size: 10.5px; color: var(--text-2); background: var(--chip); border-radius: 4px; padding: 1px 5px; margin-right: 4px; }

  .trust { margin-top: 10px; width: 100%; display: flex; align-items: center; gap: 6px; border: none; border-radius: 10px; padding: 8px 10px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; transition: transform .12s, filter .12s; }
  .trust:hover { filter: brightness(.97); }
  .trust:active { transform: scale(.98); }
  .trust span { flex: 1; }
  .trust em { font-style: normal; font-size: 11.5px; font-weight: 400; opacity: .85; }
  .trust.high { color: var(--green); background: var(--green-bg); }
  .trust.mid { color: var(--yellow); background: var(--yellow-bg); }
  .trust.low { color: var(--low); background: var(--low-bg); }
  .trust.none { color: var(--gray); background: var(--gray-bg); }

  .meta-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .mt { font-size: 11px; color: var(--text-2); background: var(--chip); border-radius: 5px; padding: 2px 6px; border: none; line-height: 1.5; }
  .mt.stale { color: var(--stale); background: var(--stale-bg); }
  .mt.good { color: var(--green); background: var(--green-bg); }
  .mt.bad { color: var(--low); background: var(--low-bg); cursor: pointer; }
  .mt.bad em { font-style: normal; display: inline-block; transition: transform .2s; }
  .mt.bad.open em { transform: rotate(180deg); }
  .mt .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--low); margin-right: 3px; vertical-align: 1px; }
  .complaints { display: none; margin-top: 6px; background: var(--low-bg); border-radius: 8px; padding: 8px 10px; }
  .complaints.show { display: block; }
  .cp-h { font-size: 11px; color: var(--low); margin-bottom: 3px; font-weight: 600; }
  .cp { font-size: 12px; color: var(--text-2); line-height: 1.65; }

  .fb-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--line); opacity: 0; transform: translateY(4px); transition: opacity .45s, transform .45s; }
  .fb-row.seen { opacity: 1; transform: none; }
  .fb-q { font-size: 12px; color: var(--text-3); flex: 1; }
  .fb-btn { font-size: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text-2); border-radius: 13px; padding: 3px 10px; cursor: pointer; }
  .fb-btn:hover { border-color: var(--red); color: var(--red); }
  .fb-err { flex-basis: 100%; order: 3; font-size: 11.5px; color: var(--low); }
  .fb-done { font-size: 12px; color: var(--text-3); }

  .ai-actions { display: flex; gap: 8px; margin-top: 6px; }
  .ai-actions .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--chip); display: flex; align-items: center; justify-content: center; color: var(--icon); }
  .ai-actions .sp { flex: 1; }
  .suggest { display: inline-block; background: var(--bubble); border-radius: 18px; padding: 10px 14px; font-size: 14px; margin-top: 10px; }

  .bottom-input { flex-shrink: 0; padding: 8px 14px 30px; background: var(--bg); color: var(--icon); }
  .input-pill { height: 50px; background: var(--card); border-radius: 25px; display: flex; align-items: center; padding: 0 14px; gap: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.04); }
  .input-pill input { flex: 1; border: none; outline: none; font-size: 15px; background: transparent; font-family: inherit; color: var(--text); }
  .ai-note { text-align: center; font-size: 11px; color: var(--text-3); margin-top: 8px; }

  /* ---------- 遮罩 / 底部弹层 / 对话框 ---------- */
  .mask { position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 10; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .phone.open-mask .mask { opacity: 1; pointer-events: auto; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--card); border-radius: 20px 20px 0 0; max-height: 88%; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  .sheet.show { transform: translateY(0); }
  .sheet.static { position: relative; transform: none; border-radius: 0; max-height: none; flex: 1; min-height: 0; }

  .sheet-head { padding: 18px 18px 10px; position: relative; flex-shrink: 0; }
  .sheet-grip { width: 36px; height: 4px; background: var(--line); border-radius: 2px; position: absolute; top: 7px; left: 50%; transform: translateX(-50%); }
  .sheet-title { font-size: 18px; font-weight: 700; padding-right: 30px; }
  .sheet-sub { font-size: 12.5px; color: var(--text-2); margin-top: 5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .trust-inline { font-size: 11px; border-radius: 5px; padding: 1px 6px; font-weight: 600; }
  .trust-inline.high { color: var(--green); background: var(--green-bg); }
  .trust-inline.mid { color: var(--yellow); background: var(--yellow-bg); }
  .trust-inline.low { color: var(--low); background: var(--low-bg); }
  .trust-inline.none { color: var(--gray); background: var(--gray-bg); }
  .sheet-close { position: absolute; right: 14px; top: 14px; width: 28px; height: 28px; border-radius: 50%; background: var(--chip); border: none; font-size: 14px; color: var(--text-2); cursor: pointer; }
  .sheet-body { overflow-y: auto; padding: 0 18px 8px; scrollbar-width: none; flex: 1; min-height: 0; }
  .sheet-body::-webkit-scrollbar { display: none; }
  .sec-title { font-size: 13px; font-weight: 600; margin: 16px 0 8px; display: flex; justify-content: space-between; }
  .sec-title span { font-weight: 400; color: var(--text-3); font-size: 12px; }

  .match { border-radius: 14px; padding: 12px 12px 8px; background: linear-gradient(135deg, var(--red-soft), var(--card)); border: 1px solid var(--red-line); }
  .match-h { font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .link { border: none; background: none; color: var(--red); font-size: 12px; cursor: pointer; font-weight: 400; }
  .match ul { list-style: none; }
  .match li { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; padding: 5px 0; line-height: 1.45; }
  .match li.off { color: var(--text-3); }
  .match-empty { font-size: 13px; color: var(--text-2); padding: 4px 0 6px; line-height: 1.5; }

  .ck { width: 19px; height: 19px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-weight: 700; margin-top: 0; }
  .ck.ok { background: var(--green); }
  .ck.warn { background: #f0b429; }
  .ck.bad { background: var(--low); }
  .ck.muted { background: #c4c4c8; }

  .checks { list-style: none; border: 1px solid var(--line); border-radius: 12px; padding: 2px 12px; }
  .checks li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line-2); font-size: 14px; }
  .checks li:last-child { border-bottom: none; }
  .insufficient { background: var(--gray-bg); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--text-2); margin-bottom: 8px; line-height: 1.5; }
  .split { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 10px 0 6px; }
  .split-legend { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-2); }

  .src-row { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line-2); cursor: pointer; align-items: flex-start; }
  .src-row:last-child { border-bottom: none; }
  .src-cover { width: 62px; height: 62px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .src-main { flex: 1; min-width: 0; }
  .src-title { font-size: 13px; font-weight: 500; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .src-main .meta-tags { margin-top: 5px; }
  .src-author { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-2); margin-top: 6px; }
  .src-author .likes { margin-left: auto; color: var(--text-3); }
  .avatar { width: 16px; height: 16px; border-radius: 50%; color: #fff; font-size: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 600; }
  .chev { color: var(--text-3); font-size: 18px; align-self: center; }
  .src-row.gone { cursor: default; opacity: .65; }
  .src-row.gone .src-cover { background: var(--gray-bg); font-size: 20px; }
  .src-sub { font-size: 11.5px; color: var(--text-3); margin-top: 4px; }

  .sheet-foot { padding: 10px 18px 28px; flex-shrink: 0; border-top: 1px solid var(--line-2); }
  .foot-btns { display: flex; gap: 10px; }
  .btn-primary { flex: 1; width: 100%; height: 44px; border: none; border-radius: 22px; background: var(--red); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-ghost { flex: 1; height: 44px; border: 1px solid var(--line); border-radius: 22px; background: var(--card); color: var(--text); font-size: 15px; cursor: pointer; }
  .algo-note { font-size: 10.5px; color: var(--text-3); text-align: center; margin-top: 8px; line-height: 1.5; }

  .fb-sheet-body { padding: 0 18px 6px; }
  .reason { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 12px; padding: 13px 14px; font-size: 14.5px; margin-bottom: 8px; cursor: pointer; text-align: left; }
  .reason:hover { border-color: var(--red); color: var(--red); }
  .reason span { color: var(--text-3); }
  .pref-entry { display: flex; align-items: center; gap: 8px; margin: 6px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--red-soft); color: var(--red); font-size: 14px; font-weight: 600; cursor: pointer; border: none; width: 100%; text-align: left; }
  .pref-entry small { font-weight: 400; color: var(--text-2); font-size: 11.5px; display: block; margin-top: 2px; }
  .pref-entry b { margin-left: auto; font-weight: 400; }

  .dialog { position: absolute; left: 34px; right: 34px; top: 50%; transform: translateY(-46%) scale(.96); opacity: 0; pointer-events: none; background: var(--card); border-radius: 16px; padding: 22px 18px 16px; z-index: 12; text-align: center; transition: all .22s; }
  .dialog.show { opacity: 1; pointer-events: auto; transform: translateY(-50%); }
  .dialog .d-ic { font-size: 30px; }
  .dialog .d-t { font-size: 17px; font-weight: 700; margin: 6px 0; }
  .dialog .d-s { font-size: 13px; color: var(--text-2); line-height: 1.55; margin-bottom: 16px; }
  .dialog .d-btns { display: flex; gap: 10px; }
  .dialog .d-btns button { height: 40px; font-size: 14px; }

  /* ---------- 二级页面（偏好设置 / 笔记详情） ---------- */
  .layer { position: absolute; inset: 0; background: var(--bg); z-index: 20; transform: translateX(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; }
  .layer.show { transform: none; }
  .prefs-static { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  .pref-intro { font-size: 13px; color: var(--text-2); margin: 4px 2px 12px; }
  .pref-sec { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .pref-h { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .pref-h span { font-size: 11.5px; color: var(--text-3); font-weight: 400; margin-left: 4px; }
  .pchips { display: flex; flex-wrap: wrap; gap: 8px; }
  .pchip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 16px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  .pchip.on { border-color: var(--red); color: var(--red); background: var(--red-soft); font-weight: 600; }
  .pref-store { font-size: 11.5px; color: var(--text-3); text-align: center; margin: 4px 0 8px; }
  .pref-foot { padding: 10px 16px 30px; flex-shrink: 0; }

  .note-nav { background: var(--card); }
  .note-nav .nm { font-size: 14px; font-weight: 600; flex: 1; display: flex; align-items: center; gap: 8px; }
  .note-nav .avatar { width: 30px; height: 30px; font-size: 13px; }
  .follow { border: 1px solid var(--red); color: var(--red); background: none; border-radius: 14px; padding: 3px 14px; font-size: 13px; }
  .note-scroll { flex: 1; overflow-y: auto; background: var(--card); scrollbar-width: none; }
  .note-scroll::-webkit-scrollbar { display: none; }
  .note-big { height: 300px; display: flex; align-items: center; justify-content: center; font-size: 84px; position: relative; }
  .ctx-bar { font-size: 11.5px; color: var(--text-3); background: var(--card); padding: 0 16px 8px; display: flex; align-items: center; gap: 6px; }
  .note-content { padding: 14px 16px; }
  .n-title { font-size: 17px; font-weight: 700; line-height: 1.45; }
  .n-body { font-size: 14.5px; line-height: 1.75; margin-top: 8px; }
  .n-meta { margin-top: 10px; }
  .n-cmt-h { font-size: 13px; color: var(--text-2); padding: 12px 16px 4px; border-top: 8px solid var(--bg); }
  .n-cmt { display: flex; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line-2); }
  .n-cmt .avatar { width: 28px; height: 28px; font-size: 12px; }
  .n-cmt .u { font-size: 12px; color: var(--text-3); display: flex; gap: 6px; align-items: center; }
  .n-cmt .c { font-size: 14px; margin-top: 3px; line-height: 1.5; }
  .neg-tag { font-size: 10px; color: var(--low); background: var(--low-bg); border-radius: 4px; padding: 0 5px; }

  .toast { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); background: rgba(0,0,0,.78); color: #fff; font-size: 13px; padding: 9px 16px; border-radius: 8px; z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s; white-space: nowrap; }
  .toast.show { opacity: 1; }

  /* ---------- v2.2：验证用户 / 吐槽核验 / 数据锚点 / 时效 / 弹窗反馈 ---------- */
  .dialog { z-index: 14; }
  .mask2 { position: absolute; inset: 0; background: rgba(0,0,0,.3); z-index: 12; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .phone.open-mask2 .mask2 { opacity: 1; pointer-events: auto; }
  .sheet-users { z-index: 13; max-height: 80%; }
  .layer-fresh { z-index: 25; }
  .layer-user { z-index: 21; }
  .layer-note { z-index: 22; }

  .trust-inline.clickable { border: none; cursor: pointer; font-family: inherit; padding: 2px 8px; font-size: 11.5px; box-shadow: inset 0 0 0 1px currentColor; }
  .trust-inline.clickable b { font-weight: 700; margin-left: 1px; }

  .checks li { align-items: flex-start; }
  .checks .ck { margin-top: 1px; }
  .ck-main { flex: 1; min-width: 0; line-height: 1.45; }
  .anchor { font-size: 11.5px; color: var(--text-3); margin-top: 3px; line-height: 1.5; }
  .anchor-link { padding: 4px 0 0; font-size: 12px; }

  .mt.time { cursor: pointer; }
  .mt.bad u { text-decoration: underline dotted; text-underline-offset: 2px; }
  .cp { padding: 5px 0; border-bottom: 1px dashed var(--red-line); }
  .cp:last-child { border-bottom: none; padding-bottom: 0; }
  .cp-t { font-size: 12.5px; color: var(--text); line-height: 1.55; }
  .cp-v { font-size: 10.5px; margin-top: 2px; }
  .cp-v.ok { color: var(--green); }
  .cp-v.no { color: var(--text-3); }
  .n-cmt .cp-v { margin-top: 0; }

  .score-anchor { display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--text-3); margin-bottom: 2px; }
  .mini-bar { display: inline-block; width: 46px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }

  /* ---- 参考来源 ---- */
  function srcCardHTML(id, page) {
    const n = notes[id];
    if (n.deleted) return `<div class="scard gone"><div class="sc-t">该内容已不可见</div><div class="sc-foot"><span>笔记已被作者删除或下架</span></div></div>`;

  /* ---- 来源角标：点击跳转原文，保留 AI 回答上下文 ---- */
  function flash(el) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  function logTagClick(page, rid, nid, position) {
    state.tagClicks++;
    track('click_source_tag', { click_count: state.tagClicks, source_page: page, position, rec_id: rid, note_id: nid, collab_status: notes[nid].collab_status });
  }
  function onSrcTag(e, el, rid) {
    e.stopPropagation();
    flash(el);
    const r = recById(rid), st = recCollab(r);
    const nid = r.notes.find(id => !notes[id].deleted && notes[id].collab_status === st);
    logTagClick('ai_answer', rid, nid, 'card_corner');
    setTimeout(() => openNote(el, nid, 'source_tag'), 160);
  }
  function onNoteRow(e, el, nid, page) {
    const tag = e.target.closest('.src-tag');
    if (tag) { flash(tag); logTagClick(page, recOfNote(nid).id, nid, 'note_row'); }
    openNote(el, nid, tag ? 'source_tag' : 'note_row');

  /* ---- 可信度验证面板（折叠卡片） ---- */
  const hasCache = rid => Object.prototype.hasOwnProperty.call(state.verifyCache, rid);
  function verifyPanelHTML(rid) {
    const open = !!state.panelOpen[rid];
    return `<div class="vp ${open ? 'open' : ''}" data-rid="${rid}">
      <button class="vp-h" onclick="toggleVerify('${rid}')" aria-expanded="${open}">${shieldIcon}<span>这条推荐为什么可信？</span><em>▾</em></button>
      <div class="vp-wrap"><div class="vp-in"><div class="vp-body">${open ? vpInnerHTML(rid) : ''}</div></div></div>
    </div>`;
  }
  function vpInnerHTML(rid) {
    if (!hasCache(rid)) return '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    const d = state.verifyCache[rid];
    if (d === 'error') return `<div class="vp-err">⚠ 验证数据加载失败<button class="link" onclick="retryVerify('${rid}')">重试</button></div>`;
    const v = verify[rid], fullBtn = `<button class="link sub" onclick="openCred('${rid}')">完整依据 ›</button>`;
    if (!d) return `<div class="vp-empty">📭 样本较少，暂无法完整验证<small>📊 ${v.list[0][2]}</small></div><div class="vp-foot"><span></span>${fullBtn}</div>`;
    const dims = [
      ['🛒', '购买验证', '', `${d.verified_purchasers_count} 位`, null, `${d.verified_purchasers_count} 位已验证购买用户用过`, v.list[0][2]],
      ['💬', '互动真实性', '', `${d.interaction_authenticity_score}/100`, d.interaction_authenticity_score, v.list[1][1], v.list[1][2]],
      ['📝', '文本相似度', '越低越原创', `${d.text_similarity_score}%`, d.text_similarity_score, v.list[2][1], v.list[2][2]],
      ['👥', '用户多样性', '', `${d.user_diversity_score}/100`, d.user_diversity_score, v.list[3][1], v.list[3][2]]
    ];
    const n = d.verified_purchasers_count;
    const who = verifiedUsers[rid] && n ? `<button class="link" onclick="openUsers('${rid}')">这 ${n} 位是谁 ›</button>` : '<span></span>';
    return dims.map(x => `<div class="vd"><div class="vd-ic">${x[0]}</div><div class="vd-main">
        <div class="vd-top">${x[1]}${x[2] ? `<small>${x[2]}</small>` : ''}<span class="v">${x[3]}</span></div>
        ${x[4] != null ? `<div class="vd-bar"><b style="width:${x[4]}%"></b></div>` : ''}
        <div class="vd-txt">${x[5]}</div><div class="anchor">📊 ${x[6]}</div></div></div>`).join('')
      + `<div class="vp-foot">${who}${fullBtn}</div>`;
  }
  function renderVpBody(rid) {
    const body = document.querySelector(`.vp[data-rid="${rid}"] .vp-body`);
    if (body && state.panelOpen[rid]) body.innerHTML = vpInnerHTML(rid);
  }
  // 模拟请求 GET /api/ai/recommendation/verify?rec_id=xx
  function fetchVerify(rid) {
    return new Promise((resolve, reject) => setTimeout(() => {
      if (!navigator.onLine) return reject(new Error('offline'));
      const d = verifyApi[rid];
      resolve(d ? { ...d, verified_users: verifiedUsers[rid] ? verifiedUsers[rid].list : [] } : null);
    }, 450));
  }
  function loadVerify(rid) {
    delete state.verifyCache[rid];
    const t0 = Date.now();
    fetchVerify(rid)
      .then(d => { state.verifyCache[rid] = d; track('api_verify', { rec_id: rid, status: 'ok', cost_ms: Date.now() - t0 }); })
      .catch(() => { state.verifyCache[rid] = 'error'; track('api_verify', { rec_id: rid, status: 'failed', cost_ms: Date.now() - t0 }); })
      .finally(() => renderVpBody(rid));
  }
  function toggleVerify(rid) {
    const vp = document.querySelector(`.vp[data-rid="${rid}"]`);
    const open = !state.panelOpen[rid];
    state.panelOpen[rid] = open;
    vp.querySelector('.vp-h').setAttribute('aria-expanded', open);
    if (!open) { vp.classList.remove('open'); return; }
    state.panelExpands++;
    track('expand_verify_panel', { rec_id: rid, expand_count: state.panelExpands, source_page: 'ai_answer' });
    if (!hasCache(rid) || state.verifyCache[rid] === 'error') loadVerify(rid);
    renderVpBody(rid);
    void vp.offsetHeight;
    vp.classList.add('open');
  }
  function retryVerify(rid) { loadVerify(rid); renderVpBody(rid); }

  /* ---- 交叉验证提示：由后端 show_cross_verify_tip 决定是否展示 ---- */
  function renderXvTip() {
    const box = $('#xvTip');
    if (!aiAnswer.show_cross_verify_tip) { box.innerHTML = ''; return; }
    box.innerHTML = '<div class="xv-tip" role="note"><i>ⓘ</i><span>该话题下存在较多不同视角的分享，建议结合原文评论区综合判断</span></div>';
    if (!state.tipExposed) tipObserver.observe(box.firstElementChild);
  }

  /* ================= 页面2：可信度解释弹窗 ================= */
  function matchHTML(r) {
    const p = state.prefs;
    if (!p) return `<div class="match"><div class="match-h">🎯 适不适合你</div>
        <div class="match-empty">暂无你的偏好信息，推荐基于热门内容生成</div>
        <button class="link" style="padding:2px 0 6px" onclick="openPrefs(this)">设置偏好，让推荐更准 ›</button></div>`;
    const items = [];
    items.push(r.skins.includes(p.skin)
      ? [1, `匹配你的肤质（${p.skin}）`]
      : [0, `不太适合你的肤质（${p.skin}），更适合${r.skins.join('/')}`]);
    const okB = p.budget === 0 || r.price <= p.budget;
    items.push([okB ? 1 : 0, `${okB ? '匹配' : '超出'}你的预算（${budgetLabel(p.budget)}）· 约 ¥${r.price}`]);
    if (p.scenes.length) {
      const inter = r.scenes.filter(s => p.scenes.includes(s));
      items.push(inter.length ? [1, `匹配你的使用场景（${inter.join('、')}）`] : [0, `没提到你的使用场景（${p.scenes.join('、')}）`]);
    }
    const all = items.every(i => i[0]);
    return `<div class="match">
      <div class="match-h">🎯 ${all ? '这条推荐匹配你的需求' : '和你的需求匹配情况'}<button class="link" onclick="openPrefs(this)">修改偏好 ›</button></div>
      <ul>${items.map(i => `<li class="${i[0] ? '' : 'off'}"><span class="ck ${i[0] ? 'ok' : 'muted'}">${i[0] ? '✓' : '!'}</span>${i[1]}</li>`).join('')}</ul>
    </div>`;
  }

  function verifyHTML(rid) {
    const v = verify[rid], r = recById(rid);
    let html = v.insufficient ? '<div class="insufficient">📭 这条推荐的验证数据还不够多，建议多对比几条</div>' : '';
    html += `<ul class="checks">${v.list.map((c, i) => `<li><span class="ck ${c[0]}">${c[0] === 'ok' ? '✓' : '!'}</span>
      <div class="ck-main"><div>${c[1]}</div>${c[2] ? `<div class="anchor">📊 ${c[2]}</div>` : ''}
      ${i === 0 && verifiedUsers[rid] ? `<button class="link anchor-link" onclick="openUsers('${rid}')">这 ${purchasers(rid)} 位是谁 ›</button>` : ''}</div></li>`).join('')}</ul>`;
    if (v.split) html += `
      <div class="split">
        <i style="width:${v.split[0]}%;background:var(--green)"></i><i style="width:${v.split[1]}%;background:#c4c4c8"></i><i style="width:${v.split[2]}%;background:var(--low)"></i>
      </div>
      <div class="split-legend"><span>👍 说好用 ${v.split[0]}%</span><span>说不清 ${v.split[1]}%</span><span>👎 说踩雷 ${v.split[2]}%</span></div>`;
    return html;
  }


  function trustBadgeHTML(r) {
    const n = purchasers(r.id);
    const cnt = !n ? '<span class="trust-inline none">验证样本较少</span>'
      : verifiedUsers[r.id] ? `<button class="trust-inline none clickable" onclick="openUsers('${r.id}')">${n} 位已验证购买 <b>›</b></button>`
      : `<span class="trust-inline none">${n} 位已验证购买</span>`;

  }

  /* ---- 时效性：产品信息是否仍有效 ---- */
  function openFresh(e, rid) {
    e.stopPropagation();
    const r = recById(rid), ph = phone1();
    const warn = r.fresh.filter(f => f[0] === 'warn').length;
    const L = ph.querySelector('.layer-fresh');
    L.innerHTML = `${statusbar()}
      <div class="navbar">
        <span class="back" onclick="closeLayer(this)">‹</span>
        <div class="title center">产品信息还有效吗？</div><span class="more"></span>
      </div>
      <div class="scroll">
        <div class="fr-head">
          <div class="rec-thumb" style="background:${r.thumbBg}">${r.emoji}</div>
          <div><div class="nm">${r.name}</div><div class="sub">🕒 今天 08:00 最新核验</div></div>
        </div>
        <div class="fr-sum ${warn ? 'warn' : 'ok'}">${warn ? `⚠ 有 ${warn} 项发生了变动，旧笔记里的说法仅供参考` : '✓ 核心信息没有变，笔记内容仍可参考'}</div>
        <ul class="checks fr-list">${r.fresh.map(f => `<li><span class="ck ${f[0]}">${f[0] === 'ok' ? '✓' : '!'}</span><div class="ck-main"><div>${f[1]}</div><div class="anchor">${f[2]}</div></div></li>`).join('')}</ul>
        <div class="algo-note" style="margin-top:12px">数据来源：品牌官方旗舰店在售价格、化妆品备案公开信息（原型中为示意数据）</div>
      </div>`;
    L.classList.add('show');
    track('click_freshness', { rec_id: rid, changed: warn });
  }

  function openCred(rid) {
    const ph = phone1();
    ph.querySelector('.sheet-cred').innerHTML = sheetHTML(rid);
    state.popup = { rid, t: Date.now() };
    track('popup_open', { rec_id: rid, from: 'verify_panel' });
    showSheet(ph, '.sheet-cred');
  }
  function closeCred(el) {
    const ph = el.closest('.phone');
    if (state.popup) {
      track('popup_close', { rec_id: state.popup.rid, duration_ms: Date.now() - state.popup.t });
      state.popup = null;
    }
    hideAll(ph);
  }
  function viewAll(el, rid) {
    toast(el.closest('.phone'), `共 ${recById(rid).notes.length} 篇引用笔记（完整列表页待开发）`);
  }

  /* ================= 笔记详情 ================= */
  function noteHTML(id) {
    const n = notes[id];
    const cmts = praise.slice(0, 2).map((t, i) => ({ u: ['小鹿不迷路', '一颗橙子'][i], t, neg: false }))
      .concat((n.complaints || []).map((c, i) => ({ u: ['芝士莓莓', '早睡选手', '路过的猫', '阿Q', '南风'][i % 5], t: c[0], neg: true, buyer: c[1] })));
    const negN = (n.complaints || []).length;
    return `${statusbar()}
      <div class="navbar note-nav">
        <span class="back" onclick="closeLayer(this)">‹</span>
        <div class="nm">${avatar(n.a)}${n.a}</div>
        <button class="follow">关注</button>
      </div>
      <div class="ctx-bar">✦ 来自点点回答「${aiAnswer.topic}」· 返回可继续查看</div>
      <div class="note-scroll">
        <div class="note-big" style="background:${n.bg}">${n.e}</div>
        <div class="note-content">
          <div class="n-title">${n.t}</div>
          <div class="n-body">${n.body}</div>
          <div class="n-meta">${metaTagsHTML(n, false, recOfNote(id).id, true)}</div>
        </div>
        <div class="n-cmt-h">共 ${cmts.length} 条评论${negN ? ` · 其中 ${negN} 条吐槽` : ''}</div>
        ${cmts.map(c => `<div class="n-cmt">${avatar(c.u)}<div><div class="u">${c.u}${c.neg ? `<span class="neg-tag">吐槽</span><span class="cp-v ${c.buyer ? 'ok' : 'no'}">${c.buyer ? '✓ 已验证购买' : '未查到购买记录'}</span>` : ''}</div><div class="c">${c.t}</div></div></div>`).join('')}
        <div style="height:40px"></div>
      </div>`;
  }
  function openNote(el, id, from) {
    const ph = el.closest('.phone') || phone1();
    const L = ph.querySelector('.layer-note');
    L.innerHTML = noteHTML(id);
    L.classList.add('show');
    track('open_note', { rec_id: recOfNote(id).id, note_id: id, from: from || 'note_row', collab_status: notes[id].collab_status });
  }
  function closeLayer(el) { el.closest('.layer').classList.remove('show'); }

  /* ================= 反馈闭环 ================= */
  function rerenderFb(id) {
    if (id !== 'answer') return;
    renderActions();
    if (state.fbError.answer) toast(phone1(), '⚠ 反馈失败，请重试');
  }
  function fbUp(id) {
    const ph = phone1();
    if (!navigator.onLine) { state.fbError[id] = true; rerenderFb(id); track('click_feedback', { rec_id: id, result: 'useful', status: 'failed' }); return; }
    state.fbError[id] = false;
    state.feedback[id] = { v: 'up' };
    state.downStreak = 0;
    rerenderFb(id);
    toast(ph, '感谢反馈');
    track('click_feedback', { rec_id: id, result: 'useful' });
  }
  function fbDown(id) {
    const ph = phone1();
    if (!navigator.onLine) { state.fbError[id] = true; rerenderFb(id); track('click_feedback', { rec_id: id, result: 'useless', status: 'failed' }); return; }
    state.fbError[id] = false;
    state.fbTarget = id;
    track('click_feedback', { rec_id: id, result: 'useless' });
    ph.querySelector('.sheet-fb').innerHTML = `
      <div class="sheet-head">
        <div class="sheet-grip"></div>
        <div class="sheet-title">这次回答哪里没帮助？</div>
        <div class="sheet-sub">${id === 'answer' ? `点点回答：${aiAnswer.topic}` : recById(id).name}</div>
        <button class="sheet-close" onclick="hideAll(this.closest('.phone'))">✕</button>
      </div>
      <div class="fb-sheet-body">
        ${['信息过时了', '不适合我', '感觉是广告', '其他原因'].map(r => `<button class="reason" onclick="pickReason('${r}')">${r}<span>›</span></button>`).join('')}
        <button class="reason" onclick="reportRec()">🚩 举报这条内容<span>›</span></button>
      </div>
      <div class="sheet-foot" style="border:none;padding-top:4px">
        <button class="pref-entry" onclick="openPrefs(this)">🎯<div>设置你的偏好<small>告诉点点你的肤质、预算、场景</small></div><b>›</b></button>
      </div>`;
    showSheet(ph, '.sheet-fb');
  }
  function pickReason(reason) {
    hideAll(phone1());
    recordDown(state.fbTarget, reason, state.fbTarget === 'answer' ? 'answer' : 'card');
  }
  function reportRec() {
    const id = state.fbTarget, ph = phone1();
    hideAll(ph);
    state.feedback[id] = { v: 'down', reason: '举报' };
    track('report', { rec_id: id, from: 'card_feedback' });
    rerenderFb(id);
    toast(ph, '已收到举报，我们会尽快核实');
  }
  function recordDown(id, reason, from) {
    const ph = phone1();
    state.feedback[id] = { v: 'down', reason };
    state.downStreak++;
    track('select_feedback_reason', { rec_id: id, reason, from });
    rerenderFb(id);
    toast(ph, '感谢反馈，我们会优化推荐');
    if (state.downStreak >= 2) {
      state.downStreak = 0;
      setTimeout(() => { ph.classList.add('open-mask'); $('#streakDialog').classList.add('show'); }, 1500);
    }
  }

  /* ---- 弹窗底部的反馈 ---- */
  function renderCredFb(rid, picking) {
    const el = phone1().querySelector('.sheet-cred .cred-fb');
    if (el) el.innerHTML = credFbHTML(rid, picking);
  }
  function credFb(rid, v) {
    const result = v === 'up' ? 'useful' : 'useless';
    if (!navigator.onLine) {
      state.fbError[rid] = true; renderCredFb(rid); rerenderFb(rid);
      track('click_feedback', { rec_id: rid, result, from: 'popup', status: 'failed' });
      return;
    }
    state.fbError[rid] = false;
    track('click_feedback', { rec_id: rid, result, from: 'popup' });
    if (v === 'down') { renderCredFb(rid, true); return; }
    state.feedback[rid] = { v: 'up' };
    state.downStreak = 0;
    renderCredFb(rid); rerenderFb(rid);
    toast(phone1(), '感谢反馈');
  }
  function credPick(rid, reason) {
    recordDown(rid, reason, 'popup');
    renderCredFb(rid);
  }

  /* ================= 偏好设置 ================= */
  function prefsPageHTML(isLayer) {
    const p = state.prefs || { skin: null, budget: null, scenes: [] };
    const chip = (g, v, label, on, multi) =>
      `<button class="pchip ${on ? 'on' : ''}" data-g="${g}" data-v="${v}" onclick="pickChip(this, ${multi ? 1 : 0})">${label}</button>`;
    return `${isLayer ? statusbar() : ''}
      <div class="navbar">
        <span class="back" onclick="${isLayer ? 'closeLayer(this)' : ''}">‹</span>
        <div class="title center">偏好设置</div><span class="more"></span>
      </div>
      <div class="scroll">
        <div class="pref-intro">告诉点点你的情况，推荐会更贴合你</div>
        <div class="pref-sec"><div class="pref-h">肤质</div><div class="pchips">${['油皮', '干皮', '混合皮', '敏感皮'].map(s => chip('skin', s, s, p.skin === s)).join('')}</div></div>
        <div class="pref-sec"><div class="pref-h">预算范围</div><div class="pchips">${[50, 100, 200, 0].map(b => chip('budget', b, budgetLabel(b), p.budget === b)).join('')}</div></div>
        <div class="pref-sec"><div class="pref-h">使用场景<span>可多选</span></div><div class="pchips">${SCENES.map(s => chip('scenes', s, s, p.scenes.includes(s), true)).join('')}</div></div>
        <div class="pref-store">${state.loggedIn ? '☁️ 已登录：偏好会同步到云端，换设备也能用' : '📱 未登录：偏好只保存在本机，换设备后不保留'}</div>
      </div>
      <div class="pref-foot"><button class="btn-primary" onclick="savePrefs(this)">保存偏好</button></div>`;
  }
  function pickChip(el, multi) {
    if (multi) { el.classList.toggle('on'); return; }
    el.parentElement.querySelectorAll('.pchip').forEach(c => c.classList.remove('on'));
    el.classList.add('on');
  }
  function openPrefs(el) {
    const ph = el.closest('.phone');
    if (el.closest('.sheet-fb') || el.closest('.dialog')) hideAll(ph);
    const L = ph.querySelector('.layer-prefs');
    L.innerHTML = prefsPageHTML(true);
    L.classList.add('show');
  }
  function savePrefs(el) {
    const root = el.closest('.prefs-root'), ph = el.closest('.phone');
    const pick = g => root.querySelector(`.pchip.on[data-g="${g}"]`);
    if (!pick('skin') || !pick('budget')) { toast(ph, '请先选择肤质和预算'); return; }
    state.prefs = {
      skin: pick('skin').dataset.v,
      budget: Number(pick('budget').dataset.v),
      scenes: [...root.querySelectorAll('.pchip.on[data-g="scenes"]')].map(c => c.dataset.v)
    };
    storePrefs();
    track('save_preference', { skin: state.prefs.skin, budget: state.prefs.budget, scenes: state.prefs.scenes, sync: state.loggedIn ? 'cloud' : 'local' });
    const layer = el.closest('.layer');
    if (layer) layer.classList.remove('show');
    renderAll();
    toast(ph, '偏好已保存，推荐会更贴合你');
  }

  /* ================= 弹层控制 ================= */
  function showSheet(ph, sel) {
    ph.classList.add('open-mask');
    ph.querySelector(sel).classList.add('show');
  }
  function hideAll(ph) {
    ph.querySelectorAll('.sheet:not(.static), .dialog').forEach(s => s.classList.remove('show'));
    ph.classList.remove('open-mask', 'open-mask2');
  }
  function onMask(mask) {
    const ph = mask.closest('.phone');
    if (ph.querySelector('.sheet-cred.show')) closeCred(mask); else hideAll(ph);
  }

  /* ================= 暗色模式：跟随系统 ================= */
  const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');
  const applyTheme = () => document.body.classList.toggle('dark', darkMQ.matches);
  darkMQ.addEventListener('change', applyTheme);

  function renderAll() {
    renderIntro();
    renderList();
    renderActions();
    if (state.popup) phone1().querySelector('.sheet-cred').innerHTML = sheetHTML(state.popup.rid);
  }

  /* ================= 内部：品牌诊断（隐藏入口） ================= */
  function showInternal() { $('#layerInternal').classList.add('show'); }
  function hideInternal() {
    $('#layerInternal').classList.remove('show');
    if (location.hash === '#internal') history.replaceState(null, '', location.pathname);
  }
  $('#ddTitle').addEventListener('click', e => { if (e.detail === 3) showInternal(); });

  function drawBrand() {
    const dims = [
      { n: '不闷痘', v: 60, gap: false }, { n: '不假滑', v: 30, gap: true }, { n: '性价比', v: 40, gap: false },
      { n: '温和度', v: 20, gap: true }, { n: '控油力', v: 60, gap: false }
    ];
    const demand = [85, 78, 65, 82, 70];
    const cx = 150, cy = 122, R = 88, N = dims.length;
    const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / N; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
    let s = '';
    [0.25, 0.5, 0.75, 1].forEach(k => { s += `<polygon points="${dims.map((_, i) => pt(i, R * k).join(',')).join(' ')}" style="fill:none;stroke:var(--line)"/>`; });
    dims.forEach((_, i) => { const [x, y] = pt(i, R); s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke:var(--line)"/>`; });
    s += `<polygon points="${demand.map((v, i) => pt(i, R * v / 100).join(',')).join(' ')}" fill="none" stroke="#b5b5b5" stroke-dasharray="4 3" stroke-width="1.2"/>`;
    s += `<polygon points="${dims.map((d, i) => pt(i, R * d.v / 100).join(',')).join(' ')}" fill="rgba(255,36,66,.18)" stroke="#ff2442" stroke-width="2"/>`;
    dims.forEach((d, i) => {
      const [x, y] = pt(i, R * d.v / 100);
      s += `<circle cx="${x}" cy="${y}" r="3.5" fill="${d.gap ? '#e8590c' : '#ff2442'}" stroke="#fff" stroke-width="1.5"/>`;
      const [lx, ly] = pt(i, R + 18);
      s += `<text x="${lx}" y="${ly + 4}" text-anchor="middle" font-size="12" style="fill:${d.gap ? '#e8590c' : 'var(--text)'}" font-weight="${d.gap ? 600 : 400}">${d.n}${d.gap ? ' ⚠' : ''}</text>`;
    });
    s += `<g font-size="10.5" fill="#888"><rect x="70" y="234" width="10" height="3" fill="#ff2442"/><text x="84" y="239">品牌内容覆盖</text>
          <line x1="164" y1="235.5" x2="176" y2="235.5" stroke="#b5b5b5" stroke-dasharray="3 2"/><text x="180" y="239">用户需求热度</text></g>`;
    $('#radar').innerHTML = s;
    $('#dimList').innerHTML = dims.map(d => `
      <div class="dim"><span class="n">${d.n}</span>
        <div class="bar"><i style="width:${d.v}%;background:${d.gap ? '#e8590c' : 'var(--red)'}"></i></div>
        <span class="pct">${d.v}%</span><span class="st ${d.gap ? 'gap' : 'cover'}">${d.gap ? '缺口' : '有覆盖'}</span></div>`).join('');
  }

  /* ================= 初始化 ================= */
  // 注入二级页面容器与 toast
  phone1().insertAdjacentHTML('beforeend',
    '<div class="layer layer-note"></div><div class="layer layer-user"></div><div class="layer layer-prefs prefs-root"></div><div class="layer layer-fresh"></div><div class="toast"></div>');

  // 交叉验证提示曝光
  tipObserver = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting || state.tipExposed) return;
      state.tipExposed++;
      tipObserver.disconnect();
      track('cross_verify_tip_expose', { topic: aiAnswer.topic, exposure_count: state.tipExposed });
    });
  }, { root: $('#scroll1'), threshold: 0.6 });

  applyTheme();
  renderAll();
  drawBrand();
  if (location.hash === '#internal') showInternal();
</script>
</body>
</html>
